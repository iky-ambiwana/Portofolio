<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turki Ambiwana - Engineer Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Stencil', sans-serif;
            background: url('../background.jpg') center/cover fixed;
            color: #399d86;
            line-height: 1.6;
            scroll-behavior: smooth;
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            padding: 1rem 0;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 1rem;
        }

        nav a {
            color: #00d4ff;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #ffffff;
        }

        section {
            padding: 5rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        #hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: url('https://i.pinimg.com/736x/c5/ee/ef/c5eeef5a38274032989f3e22a877ef60.jpg') center/cover;
            position: relative;
        }

        #hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
        }

        #hero > * {
            position: relative;
            z-index: 1;
        }

        #hero h1 {
            font-size: 4rem;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #ff0037, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        #hero p {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(45deg, #ff0000, #cc0000);
            color: white;
            padding: 1rem 2rem;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: transform 0.3s, box-shadow 0.3s;
            margin: 0.5rem;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 0, 0, 0.4);
        }

        .profile-img {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 5px solid #00d4ff;
            margin: 2rem auto;
            object-fit: cover;
            object-position: top;
        }



        .contact-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 2rem;
            border-radius: 15px;
            text-align: center;
            transition: transform 0.3s;
        }

        .contact-item:hover {
            transform: scale(1.05);
        }

        .contact-item a {
            color: #00d4ff;
            font-size: 1.5rem;
            text-decoration: none;
        }

        h2 {
            font-size: 3rem;
            text-align: center;
            margin-bottom: 3rem;
            background: linear-gradient(45deg, #00d4ff, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @media (max-width: 768px) {
            #hero h1 {
                font-size: 2.5rem;
            }
            nav ul {
                flex-direction: column;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>



    <section id="hero">
        <h2 style="font-size: 3rem; margin-bottom: 1rem; color: #ffffff;">Portofolioooo</h2>
        <img src="ikyyy.jpeg" class="profile-img">
        <h1>Turki</h1>
        <p><strong>Hobi:</strong> Coding, Gaming, Football, Gitaris, hhh!</p>
        <p><strong>Jurusan:</strong> Ilmu Komputer</p>
        <p style="font-size: 1.2rem; margin: 2rem 0; opacity: 0.9;">Jika kamu kepo bangett lebih baik cek medsosku!!!</p>
        <div style="margin-top: 1rem;">
<a href="https://instagram.com/_ikyyyyz08" target="_blank" class="btn" style="margin-right: 1rem; background: linear-gradient(45deg, #ff0000, #cc0000);">
    <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram" style="width:24px; height:24px; margin-right:8px; vertical-align:middle;">Instagram</a>
            <a href="https://tiktok.com/@bhung.kyy" target="_blank" class="btn" style="background: linear-gradient(45deg, #ff0000, #cc0000);">🎵 TikTok</a>
        </div>
    </section>

</body>
</html>



<script>
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener('click', function (e) {
            e.preventDefault();
            const target = document.querySelector(this.getAttribute('href'));
            if (target) {
                target.scrollIntoView({
                    behavior: 'smooth',
                    block: 'start'
                });
            }
        });
    });

    window.addEventListener('scroll', () => {
        const nav = document.querySelector('nav');
        if (window.scrollY > 100) {
            nav.style.background = 'rgba(10, 10, 10, 0.98)';
        } else {
            nav.style.background = 'rgba(10, 10, 10, 0.95)';
        }
    });
</script>

</body>
</html>
